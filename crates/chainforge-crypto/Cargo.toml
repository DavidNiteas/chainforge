[package]
name = "chainforge-crypto"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
chainforge-core = { path = "../chainforge-core" }
ring = "0.17"
tiny-keccak = { version = "2.0", features = ["keccak"] }
ripemd = "0.1"
secp256k1 = { version = "0.30", features = ["recovery", "rand", "global-context"] }
rand = "0.8"

[dev-dependencies]
proptest = "1.5"
hex = "0.4"
criterion = "0.5"

[[bench]]
name = "sign_bench"
harness = false
